[workspace]
members = [
    "crates/wincraft-core",
    "crates/wincraft-mcp",
    "crates/wincraft-app",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sandraschi/wincraft"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4", features = ["derive", "env"] }
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
zip = "2"
tempfile = "3"
eframe = "0.37"
